<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Assistant</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  h2.section { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
  p.sub { color: #666; margin-top: 0; margin-bottom: 1rem; }
  form { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
  input[type=text] { flex: 1 1 200px; padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  hr { border: none; border-top: 1px solid #ccc; margin: 1.5rem 0; }
  #status { min-height: 1.2rem; color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
  .job { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  .job h3 { margin: 0 0 0.25rem; font-size: 1.05rem; }
  .job .meta { color: #666; font-size: 0.9rem; margin-bottom: 0.25rem; }
  .job .source-badge { display: inline-block; font-size: 0.75rem; color: #666; border: 1px solid #999; border-radius: 4px; padding: 0 0.4rem; margin-left: 0.4rem; }
  .job .sponsor-badge { display: inline-block; font-size: 0.75rem; color: #1a7a3c; border: 1px solid #1a7a3c; border-radius: 4px; padding: 0 0.4rem; margin-left: 0.4rem; }
  .job .role-sponsor-yes { display: inline-block; font-size: 0.75rem; color: #1a7a3c; border: 1px solid #1a7a3c; border-radius: 4px; padding: 0 0.4rem; margin-left: 0.4rem; }
  .job .role-sponsor-no { display: inline-block; font-size: 0.75rem; color: #a04a00; border: 1px solid #a04a00; border-radius: 4px; padding: 0 0.4rem; margin-left: 0.4rem; }
  .job a { font-size: 0.9rem; }
  .job .attribution { font-size: 0.75rem; margin-top: 0.4rem; }
  .empty { color: #666; }
  label.checkbox { display: flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; color: #666; margin: 0 0 0.75rem; }
</style>
</head>
<body>
  <h1>Job Search Assistant</h1>
  <p class="sub">Searches NHS Jobs, Adzuna, and Reed. "Fetch new" pulls fresh postings from live sources; "Search" queries what's already stored.</p>

  <h2 class="section">Describe what you want</h2>
  <form id="nl-form">
    <input type="text" id="nl-text" placeholder="e.g. senior nurse roles in Manchester paying above £35k" required>
    <button type="submit" id="nl-btn">Find jobs</button>
  </form>

  <hr>

  <h2 class="section">Or search by field</h2>
  <form id="search-form">
    <input type="text" id="keyword" placeholder="Job role, e.g. mental health nurse" required>
    <input type="text" id="location" placeholder="Location (optional)">
    <button type="submit" id="search-btn">Search</button>
    <button type="button" id="poll-btn">Fetch new from live sites</button>
  </form>
  <label class="checkbox"><input type="checkbox" id="sponsors-only"> Only show employers registered as UK visa sponsors</label>

  <div id="status"></div>
  <div id="results"></div>

<script>
const nlForm = document.getElementById('nl-form');
const nlBtn = document.getElementById('nl-btn');
const form = document.getElementById('search-form');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const pollBtn = document.getElementById('poll-btn');

const SOURCE_LABELS = { nhs_jobs: 'NHS Jobs', adzuna: 'Adzuna', reed: 'Reed', manual: 'Pasted' };

function roleSponsorBadge(status) {
  if (status === 'no_sponsorship') return '<span class="role-sponsor-no">⚠ role states: no sponsorship</span>';
  if (status === 'sponsorship_available') return '<span class="role-sponsor-yes">✓ role states: sponsorship available</span>';
  return '';
}

function renderJobs(jobs) {
  if (!jobs.length) {
    resultsEl.innerHTML = '<p class="empty">No matches yet.</p>';
    return;
  }
  resultsEl.innerHTML = jobs.map(j => `
    <div class="job">
      <h3>${escapeHtml(j.title)}<span class="source-badge">${escapeHtml(SOURCE_LABELS[j.source] || j.source)}</span>${j.visa_sponsor_likely ? '<span class="sponsor-badge">✓ registered visa sponsor</span>' : ''}${roleSponsorBadge(j.role_sponsorship_status)}</h3>
      <div class="meta">${escapeHtml(j.org_name)}${j.location ? ' — ' + escapeHtml(j.location) : ''}</div>
      ${j.salary_range ? `<div class="meta">${escapeHtml(j.salary_range)}</div>` : ''}
      ${j.closing_date ? `<div class="meta">Closes: ${escapeHtml(j.closing_date)}</div>` : ''}
      <a href="${j.url}" target="_blank" rel="noopener">View / apply</a>
      ${j.source === 'adzuna' ? '<div class="attribution">Jobs by <a href="https://www.adzuna.co.uk" target="_blank" rel="noopener">Adzuna</a></div>' : ''}
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function doSearch() {
  const keyword = document.getElementById('keyword').value.trim();
  const location = document.getElementById('location').value.trim();
  const sponsorsOnly = document.getElementById('sponsors-only').checked;
  statusEl.textContent = 'Searching...';
  const params = new URLSearchParams({ keyword, location, limit: '30', sponsors_only: sponsorsOnly });
  const res = await fetch('/api/jobs/search?' + params.toString());
  const jobs = await res.json();
  statusEl.textContent = `${jobs.length} result(s) from the local database.`;
  renderJobs(jobs);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  await doSearch();
});

pollBtn.addEventListener('click', async () => {
  const keyword = document.getElementById('keyword').value.trim();
  const location = document.getElementById('location').value.trim();
  if (!keyword) { statusEl.textContent = 'Enter a job role first.'; return; }
  pollBtn.disabled = true;
  statusEl.textContent = 'Fetching from live sources — this can take a few seconds...';
  const params = new URLSearchParams({ keyword, location, max_pages: '1' });
  try {
    const res = await fetch('/api/jobs/poll?' + params.toString(), { method: 'POST' });
    const data = await res.json();
    const errNote = data.errors.length ? ` (${data.errors.length} source error(s) — see console)` : '';
    if (data.errors.length) console.warn('poll errors:', data.errors);
    const relatedNote = data.related_terms && data.related_terms.length
      ? ` Also searched: ${data.related_terms.join(', ')}.` : '';
    statusEl.textContent = `Fetched and saved ${data.saved} posting(s).${relatedNote}${errNote}`;
    await doSearch();
  } finally {
    pollBtn.disabled = false;
  }
});

nlForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = document.getElementById('nl-text').value.trim();
  if (!text) return;
  nlBtn.disabled = true;
  statusEl.textContent = 'Understanding your request and fetching matching jobs — this can take a few seconds...';
  try {
    const sponsorsOnly = document.getElementById('sponsors-only').checked;
    const params = new URLSearchParams({ text, max_pages: '1', limit: '30', sponsors_only: sponsorsOnly });
    const res = await fetch('/api/jobs/nlsearch?' + params.toString(), { method: 'POST' });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      statusEl.textContent = `Could not process that request${err.detail ? ': ' + err.detail : ''}.`;
      return;
    }
    const data = await res.json();
    const p = data.parsed;
    const bits = [p.keyword];
    if (p.location) bits.push('in ' + p.location);
    if (p.min_salary) bits.push('£' + Number(p.min_salary).toLocaleString() + '+');
    if (p.contract_type) bits.push(p.contract_type);
    const relatedNote = p.related_terms && p.related_terms.length
      ? ` Also searched: ${p.related_terms.join(', ')}.` : '';
    statusEl.textContent = `Understood as: ${bits.join(', ')}. ${data.jobs.length} result(s).${relatedNote}`;
    if (data.poll.errors.length) console.warn('poll errors:', data.poll.errors);
    renderJobs(data.jobs);
  } finally {
    nlBtn.disabled = false;
  }
});
</script>
</body>
</html>
